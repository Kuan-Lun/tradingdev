[project]
name = "tradingdev"
version = "0.1.0"
description = "MCP-first quantitative strategy development server"
requires-python = ">=3.14,<3.15"
dependencies = [
    "vectorbt>=1.2.0",
    "quantstats>=0.0.86",
    "matplotlib>=3.11.2",
    "bokeh>=3.10.1",
    "pandas>=3.0.6,<4.0",
    "numpy>=2.5.4",
    "TA-Lib>=0.8.2",
    "pydantic>=2.14.1",
    "ccxt>=4.5.89",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "filelock>=4.2.4",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    # Architecture decision: ML packages needed to inspect/execute bundled
    # strategies stay in runtime dependencies so MCP and CLI paths can
    # validate/dry-run any bundled strategy without installing extras.
    # Dashboard packages (streamlit, plotly) are viewer-only and no MCP tool
    # ever imports them, so they live in the `dashboard` extra below instead.
    #
    # FLAML searches the tree estimators used by bundled strategies without
    # a deep-learning stack. The named model zoo also imports XGBoost,
    # LightGBM and CatBoost directly, so each is an explicit dependency.
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "flaml>=2.7.0",
    "psutil>=7.2.2",
    "mcp[cli]>=2.3.0",
    "mcp-types>=2.3.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
    "arch>=8.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.66.0",
    "plotly>=7.1.0",
]

[project.scripts]
tradingdev = "tradingdev.adapters.cli.main:main"
tradingdev-mcp = "tradingdev.mcp.server:main"
tradingdev-report = "tradingdev.adapters.cli.reports:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingdev"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "tradingdev/_quality/pyproject.toml"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TC"]

[tool.ruff.lint.isort]
known-first-party = ["tradingdev"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, including on ContractModel.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "tradingdev.app.contracts.common.ContractModel",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[[tool.mypy.overrides]]
# PyArrow provides no py.typed marker or stubs for the dataset scanner.
module = ["pyarrow", "pyarrow.dataset"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "vectorbt.*",
    "ccxt.*",
    "xgboost.*",
    "lightgbm.*",
    "catboost.*",
    "sklearn.*",
    "pandas.*",
    "yaml.*",
    "plotly.*",
    "streamlit.*",
    "psutil.*",
    "joblib.*",
    "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# flaml ships a py.typed marker but re-exports AutoML from inside a try block
# and leaves most of its API unannotated, so mypy reports missing exports and
# untyped calls rather than anything actionable. Treat it as untyped instead.
module = ["flaml.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests, including real MCP subprocess workflows",
    "live_llm: explicitly enabled model/MCP workflows (--llm-provider codex|local)",
]

# Dev tools: [dependency-groups].dev is the canonical uv-native source.
# No [project.optional-dependencies].dev is maintained to avoid duplication.
[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    # Conversation tests verify rendered Markdown links, including code exclusions.
    "markdown-it-py>=4.2.0",
    # Markdown checks and explicit formatting share tooling/quality.py.
    "pymarkdownlnt>=0.9.41",
    "pytest>=9.1.1",
    "types-jsonschema>=4.26.0.20261006",
]
