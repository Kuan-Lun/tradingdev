[project]
name = "tradingdev"
version = "0.1.0"
description = "MCP-first quantitative strategy development server"
requires-python = ">=3.12,<3.14"
dependencies = [
    # AutoGluon constrains the shared scientific stack; update its pandas,
    # NumPy and vectorbt dependencies together when refreshing the lock.
    "vectorbt>=1.0.0",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "TA-Lib>=0.8.1",
    "pydantic>=2.13.4",
    "ccxt>=4.5.64",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "pyarrow>=20.0.0",
    "scikit-learn>=1.7.2",
    # Architecture decision: ML packages needed to inspect/execute bundled
    # strategies (xgboost, autogluon-tabular) stay in runtime dependencies so
    # MCP and CLI paths can validate/dry-run any bundled strategy without
    # installing extras. Dashboard packages (streamlit, plotly) are viewer-only
    # and no MCP tool ever imports them, so they live in the `dashboard` extra
    # below instead. AutoGluon does not officially support Python 3.14;
    # moving it to an extra would not make its bundled strategy supported.
    "xgboost>=3.1.3",
    "psutil>=7.1.3",
    "autogluon-tabular[all]>=1.5.0",
    "mcp[cli]>=1.28.1",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.59.0",
    "plotly>=6.8.0",
]

[project.scripts]
tradingdev = "tradingdev.adapters.cli.main:main"
tradingdev-mcp = "tradingdev.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingdev"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "tradingdev/_quality/pyproject.toml"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TC"]

[tool.ruff.lint.isort]
known-first-party = ["tradingdev"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[[tool.mypy.overrides]]
module = [
    "vectorbt.*",
    "ccxt.*",
    "xgboost.*",
    "sklearn.*",
    "pandas.*",
    "yaml.*",
    "plotly.*",
    "streamlit.*",
    "psutil.*",
    "joblib.*",
    "autogluon.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests, including real MCP subprocess workflows",
    "live_llm: explicitly enabled model/MCP workflows (--llm-provider codex|local)",
]

# Dev tools: [dependency-groups].dev is the canonical uv-native source.
# No [project.optional-dependencies].dev is maintained to avoid duplication.
[dependency-groups]
dev = [
    # Markdown checks and explicit formatting share scripts/quality.py.
    "pymarkdownlnt>=0.9.38",
    "pytest>=9.1.1",
]
