[project]
name = "tradingdev"
version = "0.1.0"
description = "MCP-first quantitative strategy development server"
requires-python = ">=3.12,<3.14"
dependencies = [
    # 1.1.0 requires numpy>=2.4.6, which conflicts with pandas-ta's numba
    # dependency (numpy<2.3) — 1.0.0 is the highest version resolvable
    # alongside pandas-ta today.
    "vectorbt>=1.0.0",
    # Ceiling implicitly held below 2.4.0 by autogluon-tabular's own pin
    # (pandas>=2.0.0,<2.4.0); pandas 3.x is not resolvable while
    # autogluon-tabular[all] stays a mandatory runtime dependency.
    "pandas>=2.3.3",
    # Ceiling implicitly held below 2.4.0 by autogluon-tabular's own pin
    # (numpy>=1.25.0,<2.4.0).
    "numpy>=2.2.6",
    "pandas-ta>=0.4.71b0",
    "pydantic>=2.13.4",
    "ccxt>=4.5.64",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    # Ceiling implicitly held below 21.0.0 by autogluon-common (a transitive
    # dependency of autogluon-tabular)'s own pin (pyarrow>=7.0.0,<21.0.0).
    "pyarrow>=20.0.0",
    # Ceiling implicitly held below 1.8.0 by autogluon-tabular's own pin
    # (scikit-learn>=1.4.0,<1.8.0); this floor documents the actual max
    # resolvable version rather than PyPI's global latest.
    "scikit-learn>=1.7.2",
    # Architecture decision: ML packages needed to inspect/execute bundled
    # strategies (xgboost, autogluon-tabular) stay in runtime dependencies so
    # MCP and CLI paths can validate/dry-run any bundled strategy without
    # installing extras. Dashboard packages (streamlit, plotly) are viewer-only
    # and no MCP tool ever imports them, so they live in the `dashboard` extra
    # below instead. Note: autogluon-tabular[all]'s own metadata currently
    # requires python<3.14, which blocks raising this project's upper bound;
    # revisit splitting it into a `tradingdev[ml]` extra if that becomes worth
    # resolving.
    # Ceiling implicitly held below 3.2 by autogluon-tabular[all]'s own pin
    # (xgboost>=2.0,<3.2).
    "xgboost>=3.1.3",
    # Ceiling implicitly held below 7.2.0 by autogluon-common (a transitive
    # dependency of autogluon-tabular)'s own pin (psutil>=5.7.3,<7.2.0).
    "psutil>=7.1.3",
    "autogluon-tabular[all]>=1.5.0",
    "mcp[cli]>=1.28.1",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.59.0",
    "plotly>=6.8.0",
]

[project.scripts]
tradingdev = "tradingdev.adapters.cli.main:main"
tradingdev-mcp = "tradingdev.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingdev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Dev tools: [dependency-groups].dev is the canonical uv-native source.
# No [project.optional-dependencies].dev is maintained to avoid duplication.
[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    # Provides the `pymarkdown` CLI used by scripts/hooks/finalize-markdown.sh.
    "pymarkdownlnt>=0.9.38",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
]
